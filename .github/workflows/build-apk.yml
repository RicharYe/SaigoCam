name: Build SaigoCam APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. 获取源码
      # ========================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ========================================
      # 2. 设置 JDK 17
      # ========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ========================================
      # 3. 使用 GitHub Runner 自带 Android SDK
      # 不再使用 android-actions/setup-android
      # ========================================
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Android SDK:"
          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "SDK Platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo ""
          echo "SDK Build Tools:"
          ls -la "$ANDROID_HOME/build-tools" || true


      # ========================================
      # 4. 设置 Gradle
      # 使用项目自己的 Gradle Wrapper
      # ========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false


      # ========================================
      # 5. 设置 gradlew 执行权限
      # ========================================
      - name: Make gradlew executable
        run: chmod +x ./gradlew


      # ========================================
      # 6. 显示 Java / Gradle 环境
      # ========================================
      - name: Show build environment
        run: |
          echo "========================================"
          echo "Java"
          echo "========================================"
          java -version

          echo ""
          echo "========================================"
          echo "Gradle"
          echo "========================================"
          ./gradlew --version

          echo ""
          echo "========================================"
          echo "Android SDK"
          echo "========================================"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"


      # ========================================
      # 7. 编译 Debug APK
      # ========================================
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ========================================
      # 8. 上传 APK
      # ========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SaigoCam-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ========================================
      # 9. 显示 APK
      # ========================================
      - name: Show APK information
        run: |
          echo ""
          echo "========================================"
          echo "APK 构建完成"
          echo "========================================"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;
